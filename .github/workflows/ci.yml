name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests (no API calls)
        run: PYTHONPATH=src python -m pytest tests/ -q
      - name: Smoke test - zero-volatility hand calculation
        run: |
          PYTHONPATH=src python -c "
          from gpubudget import engine
          out = engine.plan([1.5] * 120, 1000, 6, None, 2.0, 2.5, 3.0, paths_n=10)
          s = {x['id']: x for x in out['strategies']}
          assert s['reserved']['median'] == 2500.0, s['reserved']
          assert s['ondemand']['median'] == 3000.0, s['ondemand']
          assert abs(s['spot']['median'] - 1500.0) < 1e-6, s['spot']
          print('smoke ok')
          "
